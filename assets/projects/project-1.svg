<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="p1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="p1-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
    <linearGradient id="p1-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="p1-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="p1-card-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#p1-bg)"/>
  
  <!-- Subtle Grid Texture -->
  <g opacity="0.07" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="240" y1="0" x2="240" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="720" y1="0" x2="720" y2="800"/>
    <line x1="960" y1="0" x2="960" y2="800"/>
  </g>

  <!-- Ambient Glow in Top Right -->
  <circle cx="1050" cy="150" r="300" fill="url(#p1-accent)" opacity="0.12" filter="blur(60px)"/>

  <!-- Browser Frame Window -->
  <g transform="translate(60, 50)" filter="url(#p1-shadow)">
    <!-- Browser Container -->
    <rect width="1080" height="700" rx="16" fill="#0B1120" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Browser Header Bar -->
    <rect width="1080" height="48" rx="16" fill="#0F172A"/>
    <rect y="36" width="1080" height="12" fill="#0F172A"/>
    <line x1="0" y1="48" x2="1080" y2="48" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="28" cy="24" r="6" fill="#EF4444"/>
    <circle cx="48" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="68" cy="24" r="6" fill="#10B981"/>

    <!-- Address Bar -->
    <rect x="340" y="10" width="400" height="28" rx="8" fill="#1E293B"/>
    <circle cx="360" cy="24" r="4" fill="#64748B"/>
    <text x="375" y="29" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">https://apexadvisory.com</text>

    <!-- WEBSITE CONTENT -->
    <!-- Navbar -->
    <g transform="translate(40, 70)">
      <text x="0" y="24" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="1">APEX <tspan fill="#38BDF8">ADVISORY</tspan></text>
      
      <!-- Nav Links -->
      <text x="500" y="22" fill="#94A3B8" font-family="sans-serif" font-size="13" font-weight="500">Services</text>
      <text x="580" y="22" fill="#94A3B8" font-family="sans-serif" font-size="13" font-weight="500">Expertise</text>
      <text x="660" y="22" fill="#94A3B8" font-family="sans-serif" font-size="13" font-weight="500">Insights</text>
      <text x="740" y="22" fill="#94A3B8" font-family="sans-serif" font-size="13" font-weight="500">About</text>

      <!-- Nav CTA -->
      <rect x="850" y="2" width="150" height="36" rx="6" fill="url(#p1-gold)"/>
      <text x="925" y="24" fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Book Consultation</text>
    </g>

    <!-- Hero Content -->
    <g transform="translate(60, 160)">
      <!-- Badge -->
      <rect x="0" y="0" width="190" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#38BDF8"/>
      <text x="28" y="19" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="600">STRATEGIC M&amp;A ADVISORY</text>

      <!-- Main Headline -->
      <text x="0" y="70" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800">
        Capital Strategies Built for
      </text>
      <text x="0" y="118" fill="url(#p1-gold)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800">
        High-Growth Enterprises.
      </text>

      <!-- Subtext -->
      <text x="0" y="160" fill="#94A3B8" font-family="sans-serif" font-size="15" font-weight="400">
        Empowering market leaders with institutional-grade capital advisory,
      </text>
      <text x="0" y="185" fill="#94A3B8" font-family="sans-serif" font-size="15" font-weight="400">
        cross-border structuring, and corporate governance solutions.
      </text>

      <!-- CTA Buttons -->
      <rect x="0" y="220" width="170" height="46" rx="8" fill="#FFFFFF"/>
      <text x="85" y="248" fill="#0F172A" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Explore Solutions →</text>

      <rect x="185" y="220" width="160" height="46" rx="8" fill="transparent" stroke="#334155" stroke-width="1.5"/>
      <text x="265" y="248" fill="#E2E8F0" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">View Case Studies</text>

      <!-- Stat Badges Row -->
      <g transform="translate(0, 310)">
        <rect x="0" y="0" width="150" height="75" rx="10" fill="#131C31" stroke="#1E293B"/>
        <text x="20" y="32" fill="#38BDF8" font-family="sans-serif" font-size="22" font-weight="800">$1.8B+</text>
        <text x="20" y="55" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="500">Advised Transactions</text>

        <rect x="165" y="0" width="150" height="75" rx="10" fill="#131C31" stroke="#1E293B"/>
        <text x="185" y="32" fill="#38BDF8" font-family="sans-serif" font-size="22" font-weight="800">98.4%</text>
        <text x="185" y="55" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="500">Client Retention</text>

        <rect x="330" y="0" width="150" height="75" rx="10" fill="#131C31" stroke="#1E293B"/>
        <text x="350" y="32" fill="#38BDF8" font-family="sans-serif" font-size="22" font-weight="800">42</text>
        <text x="350" y="55" fill="#64748B" font-family="sans-serif" font-size="11" font-weight="500">Global Markets</text>
      </g>
    </g>

    <!-- Visual Dashboard Mockup on Right Side -->
    <g transform="translate(580, 150)" filter="url(#p1-card-glow)">
      <!-- Main Chart Card -->
      <rect x="0" y="0" width="440" height="380" rx="16" fill="#131C31" stroke="#1E293B" stroke-width="1.5"/>
      
      <text x="24" y="36" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="700">Portfolio Performance Index</text>
      <text x="24" y="58" fill="#64748B" font-family="sans-serif" font-size="12">Quarterly Aggregate Asset Valuation</text>
      
      <rect x="340" y="24" width="76" height="26" rx="13" fill="#10B981" fill-opacity="0.15"/>
      <text x="378" y="41" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">+32.4%</text>

      <!-- Chart Graphic -->
      <path d="M 30 260 C 90 240, 140 210, 190 220 C 240 230, 290 140, 340 130 C 370 125, 395 90, 410 80" fill="none" stroke="url(#p1-gold)" stroke-width="3.5" stroke-linecap="round"/>
      
      <!-- Chart Area Fill -->
      <path d="M 30 260 C 90 240, 140 210, 190 220 C 240 230, 290 140, 340 130 C 370 125, 395 90, 410 80 L 410 290 L 30 290 Z" fill="url(#p1-gold)" fill-opacity="0.08"/>

      <!-- Pulse Dot on Chart -->
      <circle cx="410" cy="80" r="6" fill="#38BDF8"/>
      <circle cx="410" cy="80" r="12" fill="#38BDF8" fill-opacity="0.25"/>

      <!-- Sub Metric Cards -->
      <g transform="translate(24, 295)">
        <rect x="0" y="0" width="186" height="60" rx="10" fill="#0F172A" stroke="#1E293B"/>
        <text x="16" y="24" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="600">ACTIVE PIPELINE</text>
        <text x="16" y="46" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">$340.5M</text>

        <rect x="206" y="0" width="186" height="60" rx="10" fill="#0F172A" stroke="#1E293B"/>
        <text x="222" y="24" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="600">AVG CLOSE TIME</text>
        <text x="222" y="46" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="700">46 Days</text>
      </g>
    </g>
  </g>
</svg>
